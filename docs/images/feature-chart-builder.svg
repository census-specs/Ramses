<svg width="860" height="460" viewBox="0 0 860 460" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <rect width="860" height="460" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="0" y="0" width="860" height="45" fill="#1E293B" rx="8 8 0 0"/>
  <text x="25" y="28" fill="#FFFFFF" font-size="14" font-weight="700">Module Chart Builder (ggplot2 &amp; Plotly interactif)</text>

  <!-- Left Mapping Controls Panel -->
  <rect x="20" y="65" width="230" height="375" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="35" y="90" fill="#0F172A" font-size="13" font-weight="700">Canaux Graphiques (Aesthetics)</text>
  
  <text x="35" y="118" fill="#475569" font-size="11" font-weight="600">Type de Géométrie (Geom) :</text>
  <rect x="35" y="126" width="200" height="28" rx="4" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="45" y="145" fill="#1E293B" font-size="12">Boxplot + Points Jitter</text>

  <text x="35" y="175" fill="#475569" font-size="11" font-weight="600">Axe X (Abscisses) :</text>
  <rect x="35" y="183" width="200" height="28" rx="4" fill="#EFF6FF" stroke="#3B82F6"/>
  <text x="45" y="202" fill="#1D4ED8" font-size="12" font-weight="600">Traitement</text>

  <text x="35" y="232" fill="#475569" font-size="11" font-weight="600">Axe Y (Ordonnées) :</text>
  <rect x="35" y="240" width="200" height="28" rx="4" fill="#ECFDF5" stroke="#10B981"/>
  <text x="45" y="259" fill="#047857" font-size="12" font-weight="600">Tension_Systolique</text>

  <text x="35" y="289" fill="#475569" font-size="11" font-weight="600">Couleur / Remplissage :</text>
  <rect x="35" y="297" width="200" height="28" rx="4" fill="#FFFBEB" stroke="#F59E0B"/>
  <text x="45" y="316" fill="#B45309" font-size="12" font-weight="600">Traitement</text>

  <rect x="35" y="385" width="200" height="34" rx="4" fill="#2563EB"/>
  <text x="65" y="407" fill="#FFFFFF" font-size="12" font-weight="600">Mettre à jour le tracé</text>

  <!-- Right Chart Canvas (ggplot2 rendering) -->
  <rect x="270" y="65" width="570" height="375" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="290" y="95" fill="#0F172A" font-size="14" font-weight="700">Distribution de la Tension Artérielle Systolique (mmHg)</text>
  
  <!-- Y-Axis Lines and ticks -->
  <line x1="330" y1="120" x2="330" y2="380" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="330" y1="380" x2="810" y2="380" stroke="#94A3B8" stroke-width="1.5"/>
  
  <text x="295" y="140" fill="#64748B" font-size="10">170</text>
  <line x1="325" y1="136" x2="810" y2="136" stroke="#F1F5F9" stroke-width="1"/>
  
  <text x="295" y="200" fill="#64748B" font-size="10">155</text>
  <line x1="325" y1="196" x2="810" y2="196" stroke="#F1F5F9" stroke-width="1"/>
  
  <text x="295" y="260" fill="#64748B" font-size="10">140</text>
  <line x1="325" y1="256" x2="810" y2="256" stroke="#E2E8F0" stroke-dasharray="4 2" stroke-width="1.5"/>
  
  <text x="295" y="320" fill="#64748B" font-size="10">125</text>
  <line x1="325" y1="316" x2="810" y2="316" stroke="#F1F5F9" stroke-width="1"/>

  <!-- Boxplot 1: Traitement A (Mean ~149) -->
  <line x1="450" y1="140" x2="450" y2="300" stroke="#475569" stroke-width="1.5"/>
  <line x1="430" y1="140" x2="470" y2="140" stroke="#475569" stroke-width="1.5"/>
  <line x1="430" y1="300" x2="470" y2="300" stroke="#475569" stroke-width="1.5"/>
  <rect x="410" y="180" width="80" height="85" fill="#475569" fill-opacity="0.25" stroke="#334155" stroke-width="2"/>
  <line x1="410" y1="222" x2="490" y2="222" stroke="#0F172A" stroke-width="3"/>

  <!-- Jitter points Traitement A -->
  <circle cx="430" cy="210" r="3.5" fill="#334155" fill-opacity="0.6"/>
  <circle cx="465" cy="195" r="3.5" fill="#334155" fill-opacity="0.6"/>
  <circle cx="445" cy="245" r="3.5" fill="#334155" fill-opacity="0.6"/>
  <circle cx="470" cy="230" r="3.5" fill="#334155" fill-opacity="0.6"/>
  <circle cx="435" cy="160" r="3.5" fill="#334155" fill-opacity="0.6"/>

  <!-- Boxplot 2: Traitement B (Mean ~140, Lower) -->
  <line x1="670" y1="180" x2="670" y2="340" stroke="#2563EB" stroke-width="1.5"/>
  <line x1="650" y1="180" x2="690" y2="180" stroke="#2563EB" stroke-width="1.5"/>
  <line x1="650" y1="340" x2="690" y2="340" stroke="#2563EB" stroke-width="1.5"/>
  <rect x="630" y="220" width="80" height="85" fill="#3B82F6" fill-opacity="0.25" stroke="#2563EB" stroke-width="2"/>
  <line x1="630" y1="262" x2="710" y2="262" stroke="#1D4ED8" stroke-width="3"/>

  <!-- Jitter points Traitement B -->
  <circle cx="650" cy="240" r="3.5" fill="#2563EB" fill-opacity="0.6"/>
  <circle cx="685" cy="275" r="3.5" fill="#2563EB" fill-opacity="0.6"/>
  <circle cx="665" cy="290" r="3.5" fill="#2563EB" fill-opacity="0.6"/>
  <circle cx="640" cy="255" r="3.5" fill="#2563EB" fill-opacity="0.6"/>
  <circle cx="690" cy="320" r="3.5" fill="#2563EB" fill-opacity="0.6"/>

  <!-- X Labels -->
  <text x="410" y="405" fill="#0F172A" font-size="12" font-weight="600">Traitement A</text>
  <text x="630" y="405" fill="#0F172A" font-size="12" font-weight="600">Traitement B</text>
</svg>